<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="pbnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="55%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="pbnBrush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="22" fill="url(#pbnBg)"/>

  <!-- Paper sheet -->
  <rect x="26" y="26" width="118" height="118" rx="10" fill="#fdfdfd"/>

  <!-- Painted half: a little pixel flower, in color -->
  <g>
    <rect x="38" y="38" width="26" height="26" fill="#ff6f91"/>
    <rect x="64" y="38" width="26" height="26" fill="#ff9ff3"/>
    <rect x="90" y="38" width="26" height="26" fill="#ff6f91"/>
    <rect x="116" y="38" width="16" height="26" fill="#ff9ff3"/>
    <rect x="38" y="64" width="26" height="26" fill="#ff9ff3"/>
    <rect x="64" y="64" width="26" height="26" fill="#ffd93d"/>
    <rect x="90" y="64" width="26" height="26" fill="#ff9ff3"/>
    <rect x="116" y="64" width="16" height="26" fill="#ff6f91"/>
  </g>

  <!-- Unpainted half: greys with numbers -->
  <g>
    <rect x="38" y="90" width="26" height="26" fill="#e2e2e6"/>
    <rect x="64" y="90" width="26" height="26" fill="#d2d2d8"/>
    <rect x="90" y="90" width="26" height="26" fill="#e2e2e6"/>
    <rect x="116" y="90" width="16" height="26" fill="#d2d2d8"/>
    <rect x="38" y="116" width="26" height="16" fill="#d2d2d8"/>
    <rect x="64" y="116" width="26" height="16" fill="#e2e2e6"/>
    <rect x="90" y="116" width="26" height="16" fill="#d2d2d8"/>
    <rect x="116" y="116" width="16" height="16" fill="#e2e2e6"/>
  </g>

  <!-- Grid lines -->
  <g stroke="#9aa0b4" stroke-width="1.5" opacity="0.55">
    <path d="M38 38 H132 M38 64 H132 M38 90 H132 M38 116 H132 M38 132 H132"/>
    <path d="M38 38 V132 M64 38 V132 M90 38 V132 M116 38 V132 M132 38 V132"/>
  </g>

  <!-- Numbers on the grey squares -->
  <g fill="#5a5a6e" font-family="Rubik, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="51" y="109">1</text>
    <text x="77" y="109">2</text>
    <text x="103" y="109">3</text>
    <text x="51" y="130">3</text>
    <text x="77" y="130">1</text>
    <text x="103" y="130">2</text>
  </g>

  <!-- Paint brush -->
  <g transform="rotate(-38 150 140)">
    <rect x="141" y="78" width="18" height="52" rx="6" fill="#8b5a2b"/>
    <rect x="139" y="126" width="22" height="16" rx="4" fill="#b2bec3"/>
    <path d="M139 140 h22 l-4 26 a7 7 0 0 1 -14 0 z" fill="url(#pbnBrush)"/>
  </g>

  <!-- Color dots -->
  <g>
    <circle cx="40" cy="168" r="13" fill="#e74c3c" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="72" cy="168" r="13" fill="#ffd93d" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="104" cy="168" r="13" fill="#38ef7d" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="136" cy="168" r="13" fill="#74b9ff" stroke="#ffffff" stroke-width="2.5"/>
  </g>
</svg>
